name: Alpha Wagerz Daily Update

on:
  schedule:
    # Run the single full-update workflow at 2:00 AM Central daily.
    - cron: "0 2 * * *"
      timezone: "America/Chicago"

  workflow_dispatch:

jobs:
  daily-update:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    concurrency:
      group: alpha-wagerz-daily-${{ github.ref_name }}
      cancel-in-progress: false

    env:
      ODDS_API_IO_KEY: ${{ secrets.ODDS_API_IO_KEY }}
      # GitHub-hosted runners often cannot reach stats.nba.com reliably.
      # Give NBA Stats requests time to respond, retrying transient failures.
      # This applies to NBA player matchup history and current-season stats.
      NBA_STATS_MAX_RETRIES: '1'
      NBA_STATS_TIMEOUT: '10'
      NBA_MATCHUPS_FAST_DAILY: '1'
      OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
      # R2 uses the "auto" signing region. Avoid AWS CLI checksum
      # extensions that are not required for these S3-compatible objects.
      AWS_DEFAULT_REGION: auto
      AWS_REGION: auto
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
      AWS_RESPONSE_CHECKSUM_VALIDATION: when_required

    steps:
      - name: Checkout model repository
        uses: actions/checkout@v6
        with:
          repository: dylhauck/alpha-wagerz-model
          token: ${{ secrets.ALPHA_WAGERZ_PAT }}
          path: alpha-wagerz-model
          fetch-depth: 1
          ref: ${{ github.ref_name }}

      - name: Checkout website repository
        uses: actions/checkout@v6
        with:
          repository: dylhauck/alpha-wagerz-web
          token: ${{ secrets.ALPHA_WAGERZ_PAT }}
          path: alpha-wagerz-web
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: alpha-wagerz-model/requirements.txt

      - name: Install Python dependencies
        working-directory: alpha-wagerz-model
        run: |
          python -m pip install -r requirements.txt

      - name: Download Statcast master from R2
        run: |
          mkdir -p alpha-wagerz-model/data/raw/mlb/statcast

          # Validate the account-level S3 endpoint before making a request.
          # Never print credentials or the endpoint's full URL.
          if [ -z "${R2_ENDPOINT_URL:-}" ]; then
            echo "::error::R2_ENDPOINT_URL secret is missing."
            exit 1
          fi
          R2_ENDPOINT_URL="${R2_ENDPOINT_URL%/}"
          if ! python -c 'import os,sys,urllib.parse; u=urllib.parse.urlparse(os.environ["R2_ENDPOINT_URL"].strip()); sys.exit(0 if u.scheme=="https" and u.hostname and u.hostname.endswith(".r2.cloudflarestorage.com") and u.path in ("", "/") and not u.query and not u.fragment else 1)'; then
            echo "::error::R2_ENDPOINT_URL must be the account-level https://<account-id>.r2.cloudflarestorage.com endpoint (no bucket or object path)."
            exit 1
          fi

          # Fail with a clear diagnostic on a persistent 400 instead of
          # masking configuration errors with unlimited retries.
          aws configure set default.retry_mode standard
          aws configure set default.max_attempts 4
          if ! aws s3api head-object \
            --bucket alpha-wagerz-statcast \
            --key statcast_longterm.zip \
            --endpoint-url "$R2_ENDPOINT_URL" \
            --output json >/dev/null; then
            echo "::error::R2 could not access statcast_longterm.zip. Verify R2 endpoint, object existence and token permissions (Object Read)."
            exit 1
          fi

          aws s3 cp \
            s3://alpha-wagerz-statcast/statcast_longterm.zip \
            /tmp/statcast_longterm.zip \
            --endpoint-url "$R2_ENDPOINT_URL"

          unzip -o /tmp/statcast_longterm.zip \
            -d alpha-wagerz-model/data/raw/mlb/statcast

          test -f alpha-wagerz-model/data/raw/mlb/statcast/statcast_longterm.csv

          # Metadata is tiny and may not exist on the first optimized run.
          if aws s3 cp \
            s3://alpha-wagerz-statcast/statcast_master_metadata.txt \
            alpha-wagerz-model/data/raw/mlb/statcast/statcast_master_metadata.txt \
            --endpoint-url "$R2_ENDPOINT_URL"; then
            echo "Statcast metadata restored from R2."
          else
            echo "No Statcast metadata found yet; Python will create it."
          fi

          echo "Statcast master restored from R2."
          ls -lh alpha-wagerz-model/data/raw/mlb/statcast/statcast_longterm.csv

      - name: Create Google credentials file
        working-directory: alpha-wagerz-model
        env:
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
        run: |
          mkdir -p config
          printf '%s' "$GOOGLE_CREDENTIALS_JSON" > config/google_credentials.json

      - name: Restore NBA fallbacks
        run: |
          mkdir -p alpha-wagerz-model/data/processed/nba/next

          cp alpha-wagerz-web/public/data/nba/schedule.json \
            alpha-wagerz-model/data/processed/nba/schedule.json

          cp alpha-wagerz-web/public/data/nba/players.json \
            alpha-wagerz-model/data/processed/nba/players.json

          cp alpha-wagerz-web/public/data/nba/team_rankings.json \
            alpha-wagerz-model/data/processed/nba/team_rankings.json

          cp alpha-wagerz-web/public/data/nba/player_matchups.json \
            alpha-wagerz-model/data/processed/nba/player_matchups.json

          cp alpha-wagerz-web/public/data/nba/next/player_matchups.json \
            alpha-wagerz-model/data/processed/nba/next/player_matchups.json

          if [ -s alpha-wagerz-web/public/data/nba/player_matchup_cache.json ]; then
            cp alpha-wagerz-web/public/data/nba/player_matchup_cache.json \
              alpha-wagerz-model/data/processed/nba/player_matchup_cache.json
          fi

          cp alpha-wagerz-web/public/data/nba/player_stats.json \
            alpha-wagerz-model/data/processed/nba/player_stats.json

          cp alpha-wagerz-web/public/data/nba/player_stats_history.json \
            alpha-wagerz-model/data/processed/nba/player_stats_history.json

          cp alpha-wagerz-web/public/data/nba/team_stats.json \
            alpha-wagerz-model/data/processed/nba/team_stats.json

          test -s alpha-wagerz-model/data/processed/nba/schedule.json
          test -s alpha-wagerz-model/data/processed/nba/players.json
          test -s alpha-wagerz-model/data/processed/nba/team_rankings.json
          test -s alpha-wagerz-model/data/processed/nba/player_matchups.json
          test -s alpha-wagerz-model/data/processed/nba/next/player_matchups.json
          test -s alpha-wagerz-model/data/processed/nba/player_stats.json
          test -s alpha-wagerz-model/data/processed/nba/player_stats_history.json
          test -s alpha-wagerz-model/data/processed/nba/team_stats.json

          echo "Complete NBA fallback state restored."
          
      - name: Restore cached NBA quarter history
        uses: actions/cache@v4
        with:
          path: alpha-wagerz-model/data/processed/nba/historical_quarters_2025-26.json
          key: nba-quarter-history-2025-26-${{ hashFiles('alpha-wagerz-model/model/nba/build_nba_period_projections.py') }}

      - name: Restore NHL historical period scoring cache
        uses: actions/cache/restore@v4
        with:
          path: alpha-wagerz-model/data/processed/nhl/period_score_cache.json
          key: nhl-period-scores-${{ github.run_id }}
          restore-keys: |
            nhl-period-scores-

      - name: Run Alpha Wagerz full update
        id: full_update
        working-directory: alpha-wagerz-model
        run: |
          python -u -m scripts.run_full_update

      # Recover missing teams from the same verified player-history pipeline.
      # Each invocation merges the previous cache; run sequentially to retain
      # history recovered for earlier teams.
      - name: Refresh Houston, San Antonio and New Orleans matchup history
        if: steps.full_update.outcome == 'success'
        working-directory: alpha-wagerz-model
        timeout-minutes: 20
        env:
          NBA_MATCHUPS_FAST_DAILY: '0'
        run: |
          for team in HOU SAS NOP; do
            echo "::group::NBA matchup recovery: $team"
            NBA_MATCHUPS_TEAM="$team" python -u -m model.nba.player_matchups
            echo "::endgroup::"
          done

      - name: Save NHL historical period scoring cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: alpha-wagerz-model/data/processed/nhl/period_score_cache.json
          key: nhl-period-scores-${{ github.run_id }}

      - name: Commit updated model data
        if: github.ref_name == 'main'
        working-directory: alpha-wagerz-model
        run: |
          git config user.name "Alpha Wagerz Automation"
          git config user.email "actions@github.com"
          git add -A

          git reset -- \
            data/raw/mlb/statcast/statcast_longterm.csv \
            data/raw/mlb/statcast/statcast_season.csv \
            data/raw/mlb/statcast/statcast_last_30_days.csv \
            data/raw/mlb/statcast/statcast_master_metadata.txt \
            2>/dev/null || true

          if git diff --cached --quiet; then
            echo "No model repository changes."
          else
            git commit -m "Automated daily Alpha Wagerz update"
            git push origin main
          fi

      - name: Commit updated website data
        if: github.ref_name == 'main'
        working-directory: alpha-wagerz-web
        run: |
          git config user.name "Alpha Wagerz Automation"
          git config user.email "actions@github.com"
          git add -A

          if git diff --cached --quiet; then
            echo "No website repository changes."
          else
            git commit -m "Automated daily Alpha Wagerz data update"
            git push origin main
          fi

      - name: Save updated Statcast master to R2
        if: ${{ always() && github.ref_name == 'main' && steps.full_update.outcome == 'success' }}
        continue-on-error: true
        run: |
          rm -f /tmp/statcast_longterm.zip

          # Fast ZIP compression. The master remains lossless; this only
          # trades a somewhat larger upload for much less CPU time.
          cd alpha-wagerz-model/data/raw/mlb/statcast
          zip -j -1 /tmp/statcast_longterm.zip statcast_longterm.csv
          cd ../../../..

          # Limit multipart concurrency and increase part size for large R2 uploads.
          aws configure set default.s3.max_concurrent_requests 2
          aws configure set default.s3.multipart_chunksize 128MB
          aws configure set default.retry_mode standard
          aws configure set default.max_attempts 5

          aws s3 cp \
            /tmp/statcast_longterm.zip \
            s3://alpha-wagerz-statcast/statcast_longterm.zip \
            --endpoint-url "$R2_ENDPOINT_URL"

          if [ -f alpha-wagerz-model/data/raw/mlb/statcast/statcast_master_metadata.txt ]; then
            echo "Uploading Statcast metadata..."
            aws s3 cp \
              alpha-wagerz-model/data/raw/mlb/statcast/statcast_master_metadata.txt \
              s3://alpha-wagerz-statcast/statcast_master_metadata.txt \
              --endpoint-url "$R2_ENDPOINT_URL"
          else
            echo "Statcast metadata file not generated; skipping metadata upload."
          fi

          echo "Updated Statcast master and metadata saved to R2."
