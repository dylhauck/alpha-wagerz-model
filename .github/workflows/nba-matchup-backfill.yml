name: NBA Historical Matchup Backfill

on:
  # Manual recovery only; the daily update now refreshes matchup history.
  workflow_dispatch:
    inputs:
      team:
        description: "NBA team abbreviation to recover (e.g. LAL, HOU, NOP)"
        required: true
        default: "LAL"
        type: string

jobs:
  historical-backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: write
    env:
      NBA_STATS_MAX_RETRIES: '1'
      NBA_STATS_TIMEOUT: '15'
      NBA_MATCHUPS_FAST_DAILY: '0'
      NBA_MATCHUPS_TEAM: ${{ inputs.team }}
    steps:
      - name: Checkout model
        uses: actions/checkout@v4
        with:
          repository: dylhauck/alpha-wagerz-model
          token: ${{ secrets.ALPHA_WAGERZ_PAT }}
          path: alpha-wagerz-model
          ref: main
      - name: Checkout web
        uses: actions/checkout@v4
        with:
          repository: dylhauck/alpha-wagerz-web
          token: ${{ secrets.ALPHA_WAGERZ_PAT }}
          path: alpha-wagerz-web
          ref: main
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        working-directory: alpha-wagerz-model
        run: pip install -r requirements.txt
      - name: Restore rosters and slate references
        run: |
          mkdir -p alpha-wagerz-model/data/processed/nba/next
          cp alpha-wagerz-web/public/data/nba/players.json alpha-wagerz-model/data/processed/nba/players.json
          cp alpha-wagerz-web/public/data/nba/slate.json alpha-wagerz-model/data/processed/nba/slate.json
          cp alpha-wagerz-web/public/data/nba/next/slate.json alpha-wagerz-model/data/processed/nba/next/slate.json
          cp alpha-wagerz-web/public/data/nba/player_matchups.json alpha-wagerz-model/data/processed/nba/player_matchups.json
          cp alpha-wagerz-web/public/data/nba/next/player_matchups.json alpha-wagerz-model/data/processed/nba/next/player_matchups.json
          if [ -f alpha-wagerz-web/public/data/nba/player_matchup_cache.json ]; then cp alpha-wagerz-web/public/data/nba/player_matchup_cache.json alpha-wagerz-model/data/processed/nba/player_matchup_cache.json; fi
      - name: Rebuild historical matchup statistics using existing slates
        working-directory: alpha-wagerz-model
        shell: bash
        run: |
          set -euo pipefail
          echo "Recovering matchup history for team: ${NBA_MATCHUPS_TEAM}"
          # Transient ESPN DNS failures must not publish blank matchup data.
          # Retry the same targeted recovery, not a full-league rebuild.
          for attempt in 1 2 3; do
            if python -u -m model.nba.player_matchups; then
              echo "Verified targeted recovery completed for ${NBA_MATCHUPS_TEAM}"
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "::error::Targeted matchup recovery failed after 3 attempts. Existing website data was not published over."
              exit 1
            fi
            echo "Attempt $attempt failed; waiting for ESPN connectivity before retry."
            sleep $((attempt * 30))
          done
      - name: Publish matchup data to website
        working-directory: alpha-wagerz-web
        run: |
          git config user.name "Alpha Wagerz Automation"
          git config user.email "actions@github.com"
          git add public/data/nba/player_matchups.json public/data/nba/next/player_matchups.json public/data/nba/player_matchup_cache.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh historical NBA player matchup statistics"
            git pull --rebase origin main
            git push origin main
          fi
